[pytest]

addopts =
    --html=reports/report.html
    --self-contained-html
    -s
    -vv

filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning

markers =
    login: Verify login scenarios
    home: Verify elements in the home page
    interactions: Verify interactions page
    TC: dynamic test case marker (e.g., @pytest.mark.TC1, @pytest.mark.TC2)

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format=%Y-%m-%d %H:%M:%S
