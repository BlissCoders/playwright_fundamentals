name: Playwright Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Run specific tests (e.g., -k "login" or -m "smoke")'
        required: false
        default: ''
      record_video:
        description: 'Record video for failed tests?'
        type: boolean
        default: false


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history to detect changes

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install --with-deps

      - name: Detect affected tests
        id: affected
        if: github.event_name == 'pull_request'
        run: |
          # Make script executable
          chmod +x ./detect_affected_tests.py
          
          # Get affected test node IDs (specific test functions, not entire files)
          AFFECTED=$(python ./detect_affected_tests.py origin/${{ github.base_ref }})
          echo "test_nodeids=$AFFECTED" >> $GITHUB_OUTPUT
          echo "Affected test node IDs:"
          echo "$AFFECTED" | tr ',' '\n'

      - name: Run pytest
        env:
          RECORD_VIDEO: ${{ github.event.inputs.record_video || 'false' }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ] && [ -z "${{ github.event.inputs.test_filter }}" ]; then
            # Run only affected test functions (not entire files/classes)
            TEST_NODEIDS="${{ steps.affected.outputs.test_nodeids }}"
            if [ -n "$TEST_NODEIDS" ] && [ "$TEST_NODEIDS" != "tests" ]; then
              echo "Running affected tests only..."
              # Convert comma-separated node IDs to pytest format
              pytest -v -s --disable-warnings $TEST_NODEIDS
            else
              echo "Running full test suite (no specific tests found)..."
              pytest -v -s --disable-warnings tests
            fi
          else
            # Run all tests for push events and manual triggers
            echo "Running all tests (push/manual mode)..."
            pytest -v -s --disable-warnings ${{ github.event.inputs.test_filter }} tests
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            tests-results/videos/
            tests-results/screenshots/
            tests-results/reports/*.html
          if-no-files-found: warn
          retention-days: 7