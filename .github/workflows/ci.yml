name: Playwright Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Run specific tests (e.g., -k "login" or -m "smoke")'
        required: false
        default: ''
      record_video:
        description: 'Record video for failed tests?'
        type: boolean
        default: false


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install --with-deps

      - name: Detect affected tests
        id: affected
        if: github.event_name == 'pull_request'
        run: |
          # Make script executable
          chmod +x ./detect_affected_tests.py
          
          # Get affected test files
          AFFECTED=$(python ./detect_affected_tests.py origin/${{ github.base_ref }})
          echo "test_paths=$AFFECTED" >> $GITHUB_OUTPUT
          echo "Affected tests: $AFFECTED"

      - name: Run pytest
        env:
          RECORD_VIDEO: ${{ github.event.inputs.record_video || 'false' }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ] && [ -z "${{ github.event.inputs.test_filter }}" ]; then
            # Run only affected tests
            TEST_PATHS="${{ steps.affected.outputs.test_paths }}"
            echo "Running affected tests: $TEST_PATHS"
            pytest -v -s --disable-warnings ${{ github.event.inputs.test_filter }} $TEST_PATHS
          else
            # Run all tests
            echo "Running all tests"
            pytest -v -s --disable-warnings ${{ github.event.inputs.test_filter }} tests
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            tests-results/videos/
            tests-results/screenshots/
            tests-results/reports/*.html
          if-no-files-found: warn
          retention-days: 7